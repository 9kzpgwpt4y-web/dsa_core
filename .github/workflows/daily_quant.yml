name: DSA Core Daily Quant Run

on:
  schedule:
    # 每天 UTC 时间 10:00 (北京/新加坡时间 18:00) 执行，周一到周五
    - cron: '0 10 * * 1-5'
  workflow_dispatch: # 允许手动点击按钮触发，方便调试

jobs:
  run-agent:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # 建议用 3.11/3.12 提高稳定性
        cache: 'pip'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 运行 AI 大脑生成研报
      env:
        # 将 GitHub Secrets 映射到环境变量
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PYTHONPATH: "."
      run: |
        python -m src.scripts.run_agent # 或者你用来生成/推送每日报告的脚本