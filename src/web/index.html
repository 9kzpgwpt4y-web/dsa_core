<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>DSA CORE | 智能量化终端</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; overflow: hidden; }
        .glass-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; }
        #chart-container { min-height: 450px; background-color: #0f172a; }
        .btn-action { transition: all 0.2s; cursor: pointer; }
        .btn-action:hover { filter: brightness(1.2); transform: translateY(-1px); }
        .btn-disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body class="h-screen flex flex-col p-4">

    <div class="flex justify-between items-center mb-4 shrink-0">
        <div class="flex items-center space-x-4">
            <h1 class="text-xl font-bold text-blue-400 tracking-tight">DSA CORE</h1>
            <div id="status-tag" class="text-[10px] bg-slate-800 px-2 py-1 rounded border border-slate-700 text-blue-300">正在连接服务器...</div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="document.getElementById('img-upload').click()" class="btn-action text-[10px] flex items-center bg-slate-800 px-3 py-1.5 rounded border border-slate-700 text-slate-400">
                <span class="mr-1">📷</span> 识图分析持仓
            </button>
            <input type="file" id="img-upload" hidden accept="image/*" onchange="handleImageUpload(this)">
            
            <input id="stock-code" type="text" value="000333" class="bg-slate-900 border border-slate-700 px-3 py-1.5 rounded text-sm text-white w-32 focus:border-blue-500 outline-none">
            <button id="btn-analyze" onclick="startAnalysis()" class="btn-action bg-blue-600 px-6 py-1.5 rounded text-sm font-bold">分析</button>
        </div>
    </div>

    <div class="flex-1 grid grid-cols-12 gap-4 overflow-hidden">
        <div class="col-span-9 flex flex-col space-y-4 overflow-hidden">
            <div class="glass-card flex-1 p-4 flex flex-col relative">
                <div class="text-[11px] text-slate-500 mb-2 flex justify-between">
                    <span>行情走势 (Sina Realtime)</span>
                    <span id="chart-info">--</span>
                </div>
                <div id="chart-container" class="flex-1 rounded"></div>
            </div>
            <div class="grid grid-cols-4 gap-4 shrink-0">
                <div class="glass-card p-4 border-l-4 border-l-emerald-500">
                    <p class="text-[10px] text-slate-500 uppercase">建议入场</p>
                    <p id="res-buy" class="text-xl font-mono text-emerald-400 mt-1">--</p>
                </div>
                <div class="glass-card p-4 border-l-4 border-l-blue-500">
                    <p class="text-[10px] text-slate-500 uppercase">仓位权重</p>
                    <p id="res-add" class="text-xl font-mono text-blue-400 mt-1">--</p>
                </div>
                <div class="glass-card p-4 border-l-4 border-l-rose-500">
                    <p class="text-[10px] text-slate-500 uppercase">止损价格</p>
                    <p id="res-stop" class="text-xl font-mono text-rose-400 mt-1">--</p>
                </div>
                <div class="glass-card p-4 border-l-4 border-l-orange-500">
                    <p class="text-[10px] text-slate-500 uppercase">目标止盈</p>
                    <p id="res-target" class="text-xl font-mono text-orange-400 mt-1">--</p>
                </div>
            </div>
        </div>

        <div class="col-span-3 flex flex-col space-y-4 overflow-hidden">
            <div class="glass-card flex-1 p-4 flex flex-col overflow-hidden">
                <h3 class="text-xs font-bold text-blue-400 uppercase mb-3 border-b border-slate-700 pb-1">AI 深度诊断</h3>
                <div id="res-conclusion" class="text-sm text-slate-400 overflow-y-auto pr-2 leading-relaxed">等待输入代码或上传截图...</div>
            </div>
            <div class="glass-card h-1/3 p-4 flex flex-col overflow-hidden">
                <h3 class="text-xs font-bold text-slate-500 uppercase mb-2">舆情监测</h3>
                <div id="news-list" class="space-y-3 text-[11px] text-slate-400 overflow-y-auto pr-1">
                    <div class="text-slate-600 italic">实时资讯流关闭中</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. 全局变量提前声明，防止 ReferenceError
        let chart = null;
        let candlestickSeries = null;
        let ws = null;

        // 2. 初始化图表引擎
        function initChart() {
            const container = document.getElementById('chart-container');
            if (!container) return;
            
            try {
                container.innerHTML = '';
                chart = LightweightCharts.createChart(container, {
                    layout: { background: { color: '#0f172a' }, textColor: '#94a3b8' },
                    grid: { vertLines: { color: '#1e293b' }, horzLines: { color: '#1e293b' } },
                    width: container.clientWidth,
                    height: container.clientHeight || 450,
                });

                candlestickSeries = chart.addCandlestickSeries({
                    upColor: '#ef4444', downColor: '#22c55e',
                    borderUpColor: '#ef4444', borderDownColor: '#22c55e',
                    wickUpColor: '#ef4444', wickDownColor: '#22c55e'
                });
                console.log("✅ 图表初始化成功");
            } catch (e) {
                console.error("❌ 图表加载失败:", e);
            }
        }

        // 3. WebSocket 连接管理
        function connectWS() {
            const wsUrl = `ws://${window.location.host}/ws/analyze`;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                document.getElementById('status-tag').innerText = "系统就绪";
                document.getElementById('btn-analyze').classList.remove('btn-disabled');
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                
                if (msg.type === 'kline' && candlestickSeries) {
                    const data = msg.data.map(d => ({
                        time: d.time.split(' ')[0], 
                        open: parseFloat(d.open), high: parseFloat(d.high),
                        low: parseFloat(d.low), close: parseFloat(d.close)
                    })).sort((a, b) => new Date(a.time) - new Date(b.time));
                    candlestickSeries.setData(data);
                    chart.timeScale().fitContent();
                    document.getElementById('chart-info').innerText = "数据已同步";
                }

                if (msg.type === 'news') {
                    const list = document.getElementById('news-list');
                    list.innerHTML = (msg.data && msg.data.length > 0) ? 
                        msg.data.map(n => `<div class="border-b border-slate-800 pb-2"><div class="text-blue-400 mb-1">${n.title}</div><div class="text-[9px] text-slate-600">${n.time || 'NOW'}</div></div>`).join('') :
                        `<div class="text-amber-500 text-[10px]">⚠️ 无法获取实时新闻，已强化技术面诊断</div>`;
                }

                if (msg.type === 'status') document.getElementById('status-tag').innerText = msg.message;

                if (msg.type === 'result') {
                    const p = msg.payload;
                    document.getElementById('res-buy').innerText = p.entry_price || '--';
                    document.getElementById('res-stop').innerText = p.stop_loss || '--';
                    document.getElementById('res-target').innerText = p.target_price || '--';
                    document.getElementById('res-add').innerText = "20%";
                    document.getElementById('res-conclusion').innerHTML = `<div class="text-blue-300 font-bold mb-2">分析结论：</div>${p.conclusion}`;
                }
            };

            ws.onclose = () => {
                document.getElementById('status-tag').innerText = "连接已断开，重连中...";
                setTimeout(connectWS, 3000);
            };
        }

        // 4. 识图分析逻辑
        async function handleImageUpload(input) {
            if (!input.files || !input.files[0]) return;
            const status = document.getElementById('status-tag');
            status.innerText = "正在识别图片内容...";
            
            const formData = new FormData();
            formData.append('file', input.files[0]);

            try {
                const response = await fetch('/upload_image', { method: 'POST', body: formData });
                const result = await response.json();
                if (result.status === 'success') {
                    document.getElementById('res-conclusion').innerHTML = `<div class="text-emerald-400 font-bold mb-2">[持仓截图诊断结果]</div>${result.analysis}`;
                    status.innerText = "识图诊断完成";
                } else {
                    status.innerText = "识别失败";
                }
            } catch (err) {
                status.innerText = "上传出错";
            }
        }

        // 5. 点击“分析”按钮触发
        function startAnalysis() {
            const code = document.getElementById('stock-code').value.trim();
            if (!code) return;

            // 检查 ws 是否已初始化且开启
            if (ws && ws.readyState === WebSocket.OPEN) {
                document.getElementById('res-conclusion').innerText = "正在穿透网关调取数据...";
                ws.send(JSON.stringify({ code: code }));
            } else {
                alert("正在重新连接服务器，请稍后再试");
            }
        }

        // 页面入口
        window.onload = () => {
            initChart();
            connectWS();
        };

        window.onresize = () => {
            if (chart) chart.applyOptions({ width: document.getElementById('chart-container').clientWidth });
        };
    </script>
</body>
</html>
